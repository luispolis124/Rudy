name: Rudy Generated & Regeneration Pipeline

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'src/**'
      - 'examples/**'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Build Dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller .

    - name: Test Standalone Compilation (--build)
      run: |
        echo "--- [Rudy Regen Engine] Testando a regeração de executável standalone ---"
        for script in examples/*.rudy; do
          if [ -f "$script" ]; then
            echo "Compilando standalone para: $script"
            python src/rudy.py "$script" --build
          fi
        done
      shell: bash

    - name: Archive Generated Binaries / Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rudy-dist-binaries
        path: dist/
