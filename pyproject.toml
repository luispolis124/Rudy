[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rudy-lang"
version = "1.0.0"
description = "A lightweight, bilingual (PT/EN) programming language designed for portability, retro ASCII games, and automation."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Luis Felipe", email = "luisfelipovi@gmail.com"}
]
keywords = ["programming-language", "interpreter", "ast", "bilingual", "termux", "ascii-games"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Interpreters",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/luispolis124/Rudy"
Documentation = "https://github.com/luispolis124/Rudy/tree/main/docs"
Repository = "https://github.com/luispolis124/Rudy"

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
rudy = "rudy:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["rudy"]

[tool.pyright]
pythonVersion = "3.8"
include = ["src"]
exclude = ["dist", "build", "stdlib", "__pycache__"]
