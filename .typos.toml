# .typos.toml — Source code spell checker configuration for Rudy

[files]
extend-exclude = [
    "dist/",
    "build/",
    "stdlib/",
    ".git/",
    "*.pyc",
]

[default.extend-words]
# Termos em português e nomes de variáveis/classes da Rudy
leve = "leve"
programa = "programa"
programanode = "programa"
comando = "comando"
atual = "atual"
erro = "erro"
condicional = "condicional"
oficial = "oficial"
profissional = "profissional"
acao = "acao"
senao = "senao"
enquanto = "enquanto"
entao = "entao"
ler = "ler"
aleatorio = "aleatorio"
pausar = "pausar"
salvar = "salvar"
carregar = "carregar"
limpar = "limpar"
rudy = "rudy"
luis = "luis"
felipe = "felipe"
tema = "tema"
interactivo = "interactivo"
